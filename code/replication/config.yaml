resources: [cpus=20, mem_mb=848576, jobweight=40, solo=1]
# Directory configurations
base_dir: "/data2/morgante_lab/ukbiobank_projects/prs_effects/filter"
results_dir: "/data2/morgante_lab/ukbiobank_projects/prs_effects/results/replication"
geno_dir: "/data2/morgante_lab/ukbiobank_projects/prs_effects/results/replication/filter"
plink2_path: "/data2/morgante_lab/yuxuans/software/plink2"
log_dir: "/data2/morgante_lab/ukbiobank_projects/prs_effects/logs/replication_snakemake"
error_dir: "/data2/morgante_lab/ukbiobank_projects/prs_effects/replication_snakemake"
code_dir: "/data2/morgante_lab/ukbiobank_projects/prs_effects/code"
R_LIB1: "/data2/morgante_lab/yuxuans/software/R/x86_64-pc-linux-gnu-library/4.2"
R_LIB2: "/opt/ohpc/pub/Software/R-4.2.3/lib64/R/library"
fam_dir: "/data2/morgante_lab/data/ukbiobank/genotypes/array/fam_04042024"
bed_bim_dir: "/data2/morgante_lab/data/ukbiobank/genotypes/array"

# Global default resources for all rules
__default__:
  mem_mb: 848576 
  time: "3-00:00:00"   # 3 days
  partition: "fm-bigmem-2"
  threads: 4
  mail_user: "yuxuans@clemson.edu"
  mail_type: "FAIL"

# Cluster submission command template
cluster: 
  "mkdir -p {log_dir}/{rule} && sbatch --partition={resources.partition} --cpus-per-task={resources.threads} --mem={resources.mem_mb} --job-name={rule}_{wildcards} --output={log_dir}/{rule}/%j_{rule}_{wildcards}.out --error={error_dir}/{rule}/%j_{rule}_{wildcards}.err --time={resources.time} --mail-user={resources.mail_user} --mail-type={resources.mail_type}"
